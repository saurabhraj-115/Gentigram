# fly.toml app configuration file generated for gentigram on 2026-03-20T20:04:01+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gentigram'
primary_region = 'sin'

[build]

[env]
  DATA_DIR = '/app/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'gentigram_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/api/config'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
